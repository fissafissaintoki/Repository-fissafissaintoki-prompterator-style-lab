<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kyron Radar">
<link rel="manifest" href="manifest.webmanifest">
<title>KYRON Market Radar Mobile</title>
<style>
:root{--bg:#080a0f;--panel:#11151d;--muted:#8d96a8;--text:#edf2ff;--line:#252b36;--good:#35d07f;--warn:#ffcc66;--bad:#ff5c72;--accent:#7aa2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:10;background:rgba(8,10,15,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.wrap{padding:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}.k{color:var(--muted);font-size:11px}.v{font-size:19px;font-weight:800;margin-top:2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.controls>*{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.controls .wide{grid-column:1/-1}.list{display:flex;flex-direction:column;gap:8px}.coin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.top{display:flex;justify-content:space-between;gap:8px}.sym{font-size:17px;font-weight:800}.sig{font-size:12px;font-weight:900}.break{color:var(--good)}.watch{color:var(--warn)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.m{font-size:11px;color:var(--muted)}.n{font-size:14px;font-weight:700}.up{color:var(--good)}.down{color:var(--bad)}.bar{height:7px;background:#272d38;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--accent)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,15,21,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bottom button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:12px}.bottom button.active{border-color:var(--accent)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--bad);margin-right:6px}.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}.note{font-size:11px;color:var(--muted);margin:10px 2px}
</style>
</head>
<body>
<header><h1>KYRON Market Radar <span style="color:var(--accent)">Mobile</span></h1><div class="sub"><span id="dot" class="dot"></span><span id="status">Verbinde…</span> · sekündliche Rangliste</div></header>
<div class="wrap"><div class="stats"><div class="card"><div class="k">Liquide Paare</div><div class="v" id="pairs">0</div></div><div class="card"><div class="k">Breakouts</div><div class="v" id="breakouts">0</div></div><div class="card"><div class="k">Watch-Signale</div><div class="v" id="watches">0</div></div><div class="card"><div class="k">Updates/Sek.</div><div class="v" id="ups">0</div></div></div>
<div class="controls"><input id="search" class="wide" placeholder="Coin suchen, z. B. BTC"><select id="minVol"><option value="1000000">Vol. ≥ 1 Mio.</option><option value="5000000" selected>Vol. ≥ 5 Mio.</option><option value="20000000">Vol. ≥ 20 Mio.</option><option value="100000000">Vol. ≥ 100 Mio.</option></select><select id="window"><option value="60">Fenster 60 s</option><option value="180" selected>Fenster 3 min</option><option value="300">Fenster 5 min</option><option value="900">Fenster 15 min</option></select><select id="threshold"><option value="0.10">Puffer 0,10 %</option><option value="0.20" selected>Puffer 0,20 %</option><option value="0.50">Puffer 0,50 %</option><option value="1.00">Puffer 1,00 %</option></select><button id="install">Zum Home-Bildschirm</button></div><div id="list" class="list"></div><div class="note">Nur Marktbeobachtung. Keine automatische Orderausführung. Breakout = neues Rolling-Hoch + Momentum + Liquidität.</div></div>
<div class="bottom"><button id="all" class="active">Alle</button><button id="onlyBreak">Breakouts</button><button id="sound">Ton AUS</button></div>
<script>
const state=new Map(),history=new Map();let socket,updates=0,sound=false,mode="all",deferredPrompt,lastBeep=0;const $=id=>document.getElementById(id);function fmt(n,d=4){if(!Number.isFinite(n))return"–";return n.toLocaleString("de-DE",{maximumFractionDigits:d})}function compact(n){return new Intl.NumberFormat("de-DE",{notation:"compact",maximumFractionDigits:2}).format(n)}function beep(){if(!sound||Date.now()-lastBeep<5000)return;lastBeep=Date.now();const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}function connect(){if(socket)try{socket.close()}catch(e){}$("status").textContent="Verbinde…";$("dot").classList.remove("on");socket=new WebSocket("wss://stream.binance.com:9443/ws/!miniTicker@arr");socket.onopen=()=>{$("status").textContent="Live · Binance Spot";$("dot").classList.add("on")};socket.onclose=()=>{$("status").textContent="Getrennt · neuer Versuch";$("dot").classList.remove("on");setTimeout(connect,3000)};socket.onerror=()=>socket.close();socket.onmessage=e=>{const arr=JSON.parse(e.data),now=Date.now();updates+=arr.length;for(const x of arr){if(!x.s.endsWith("USDT")||x.s.includes("UPUSDT")||x.s.includes("DOWNUSDT"))continue;const p=+x.c,open=+x.o,vol=+x.q;state.set(x.s,{symbol:x.s,price:p,change:(p/open-1)*100,volume:vol});let h=history.get(x.s)||[];h.push([now,p]);const win=+$("window").value*1000;while(h.length&&h[0][0]<now-win)h.shift();history.set(x.s,h)}}}function calc(r){const h=history.get(r.symbol)||[],cutoff=Date.now()-60000,old=h.find(x=>x[0]>=cutoff)||h[0]||[0,r.price];const mom=(r.price/old[1]-1)*100,prior=h.slice(0,-1),high=prior.length?Math.max(...prior.map(x=>x[1])):r.price,dist=(r.price/high-1)*100,thr=+$("threshold").value;const liq=Math.min(35,Math.log10(Math.max(r.volume,1))*4),score=Math.max(0,Math.min(100,50+mom*18+dist*25+liq-28));let signal="–",cls="";if(dist>=thr&&mom>.12){signal="BREAKOUT";cls="break";beep()}else if(dist>-.25&&mom>.05){signal="WATCH";cls="watch"}return {...r,mom,dist,score,signal,cls}}function render(){const minVol=+$("minVol").value,q=$("search").value.trim().toUpperCase();let rows=[...state.values()].filter(x=>x.volume>=minVol&&(!q||x.symbol.includes(q))).map(calc);if(mode==="break")rows=rows.filter(x=>x.signal==="BREAKOUT");rows.sort((a,b)=>(b.signal==="BREAKOUT")-(a.signal==="BREAKOUT")||b.score-a.score);rows=rows.slice(0,60);$("pairs").textContent=[...state.values()].filter(x=>x.volume>=minVol).length;$("breakouts").textContent=rows.filter(x=>x.signal==="BREAKOUT").length;$("watches").textContent=rows.filter(x=>x.signal==="WATCH").length;$("list").innerHTML=rows.map(x=>`<div class="coin"><div class="top"><div><span class="sym">${x.symbol.replace("USDT","")}</span><span class="m"> / USDT</span></div><div class="sig ${x.cls}">${x.signal}</div></div><div class="grid"><div><div class="m">Kurs</div><div class="n">${fmt(x.price,x.price<1?7:4)}</div></div><div><div class="m">24 h</div><div class="n ${x.change>=0?"up":"down"}">${x.change>=0?"+":""}${fmt(x.change,2)}%</div></div><div><div class="m">Volumen</div><div class="n">${compact(x.volume)}</div></div><div><div class="m">High-Distanz</div><div class="n ${x.dist>=0?"up":""}">${x.dist>=0?"+":""}${fmt(x.dist,2)}%</div></div><div><div class="m">Momentum</div><div class="n ${x.mom>=0?"up":"down"}">${x.mom>=0?"+":""}${fmt(x.mom,2)}%</div></div><div><div class="m">Score</div><div class="n">${Math.round(x.score)}</div></div></div><div class="bar"><div class="fill" style="width:${x.score}%"></div></div></div>`).join("")}setInterval(render,1000);setInterval(()=>{$("ups").textContent=updates;updates=0},1000);["search","minVol","window","threshold"].forEach(id=>$(id).addEventListener("input",render));$("sound").onclick=()=>{sound=!sound;$("sound").textContent="Ton "+(sound?"AN":"AUS");$("sound").classList.toggle("active",sound)};$("all").onclick=()=>{mode="all";$("all").classList.add("active");$("onlyBreak").classList.remove("active");render()};$("onlyBreak").onclick=()=>{mode="break";$("onlyBreak").classList.add("active");$("all").classList.remove("active");render()};window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});$("install").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice}else alert("iPhone: Safari → Teilen → Zum Home-Bildschirm. Android: Browser-Menü → App installieren.")};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");connect();
</script></body></html>
